<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMG People & Pay OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Industrial modern: graphite rail, cool steel surfaces, wide air, safety-orange used only as the marker. */
:root{--bg:#f4f6f8;--surface:#ffffff;--surface2:#f7f9fb;--ink:#161b22;--muted:#667281;--line:#e6eaef;--line2:#d5dbe3;--accent:#1f2a37;--on-accent:#ffffff;--signal:#f26b21;--steel:#3b4a5c;--good:#17784f;--warn:#9a5b00;--bad:#b3261e;--good-bg:#e6f4ed;--warn-bg:#fdf1de;--bad-bg:#fbe9e7;--rail:#161d27;--rail-ink:#aab5c2;--r:14px;--sh:0 1px 2px rgba(22,27,34,.04),0 8px 24px -12px rgba(22,27,34,.10);--sh2:0 2px 4px rgba(22,27,34,.05),0 16px 32px -14px rgba(22,27,34,.18);--display:'Manrope',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131a;--surface:#161d27;--surface2:#1a222d;--ink:#e8edf2;--muted:#8d9aa9;--line:#243040;--line2:#2f3d50;--accent:#e8edf2;--on-accent:#0e131a;--signal:#ff8140;--steel:#9fb0c3;--good:#4cc38a;--warn:#f0b429;--bad:#ff8a7d;--good-bg:#10312a;--warn-bg:#352b12;--bad-bg:#3a1c1a;--rail:#0a0e14;--rail-ink:#8d9aa9;--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 8px 24px -8px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131a;--surface:#161d27;--surface2:#1a222d;--ink:#e8edf2;--muted:#8d9aa9;--line:#243040;--line2:#2f3d50;--accent:#e8edf2;--on-accent:#0e131a;--signal:#ff8140;--steel:#9fb0c3;--good:#4cc38a;--warn:#f0b429;--bad:#ff8a7d;--good-bg:#10312a;--warn-bg:#352b12;--bad-bg:#3a1c1a;--rail:#0a0e14;--rail-ink:#8d9aa9;--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 8px 24px -8px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em;font-weight:700}
h2{font-size:1.65rem;font-weight:800}h3{font-size:1.02rem}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:14px 24px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);color:var(--ink);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--rail);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;position:relative;overflow:hidden}
.mark:after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;background:var(--signal);border-top-left-radius:11px}
.brand b{font-family:var(--display);font-size:1.02rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.02em}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who select{background:var(--surface2);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;max-width:100%}
.who select option{color:#161b22;background:#fff}
nav.rail{display:flex;gap:6px;overflow-x:auto;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
nav.rail button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--steel);transition:background .15s,color .15s}
nav.rail button:hover{background:var(--line)}
nav.rail button[aria-current="true"]{background:var(--rail);color:#fff;border-color:var(--rail)}
main{padding:32px 32px 56px;max-width:1240px;width:100%;margin:0 auto}
@media (min-width:900px){.shell{grid-template-columns:236px 1fr;grid-template-rows:auto 1fr}header.top{grid-column:1/3}
 nav.rail{flex-direction:column;overflow:visible;background:var(--rail);border:0;padding:22px 14px;gap:2px;min-height:calc(100vh - 66px)}
 nav.rail button{border:0;background:transparent;border-radius:10px;text-align:left;color:var(--rail-ink);padding:9px 14px;position:relative}
 nav.rail button:hover{background:rgba(255,255,255,.06);color:#fff}
 nav.rail button[aria-current="true"]{background:rgba(255,255,255,.09);color:#fff}
 nav.rail button[aria-current="true"]:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--signal)}}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:28px}
.head p{margin:6px 0 0;color:var(--muted);max-width:66ch;font-size:.95rem}
.grid{display:grid;gap:18px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--sh);position:relative}
.tile:before{content:"";position:absolute;left:18px;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--signal)}
.tile .n{font-family:var(--display);font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:4px}
.tile .l{color:var(--muted);font-size:.8rem;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:22px;box-shadow:var(--sh)}
.card>h3{margin-bottom:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.muted{color:var(--muted)}.small{font-size:.82rem}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}
.scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem}
th,td{padding:12px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
td.wrap,th.wrap{white-space:normal;min-width:160px}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line2);padding-top:6px}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.73rem;font-weight:600;background:var(--surface2);color:var(--steel);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 15px;cursor:pointer;font-weight:600;transition:background .15s,box-shadow .15s,border-color .15s}
.btn:hover{background:var(--surface2);border-color:var(--steel)}
.btn.primary{background:var(--rail);color:#fff;border-color:var(--rail)}
.btn.primary:hover{background:var(--steel);border-color:var(--steel);box-shadow:var(--sh)}
.btn.sm{padding:4px 11px;font-size:.8rem;border-radius:8px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;max-width:100%}
input:hover,select:hover{border-color:var(--steel)}
input[type=number]{width:84px}
textarea{width:100%;min-height:68px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.76rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
.form{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--signal);border-radius:99px}
.bar.good i{background:var(--steel)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:16px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:120px}
.col h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.gwc{display:flex;gap:5px}
.gwc button{width:32px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--surface2);cursor:pointer;font-weight:700}
.gwc button.on{background:var(--rail);color:#fff;border-color:var(--rail)}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.steps span{font-size:.72rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--rail);color:#fff;border-color:var(--rail)}
.links{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.link{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface2)}
.link b{font-family:var(--display);font-size:1.1rem}
.veil{position:fixed;inset:0;background:rgba(10,14,20,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:18px;max-width:660px;width:100%;max-height:88%;overflow:auto;padding:26px;border:1px solid var(--line);box-shadow:var(--sh2)}
.modal pre{white-space:pre-wrap;background:var(--surface2);padding:14px;border-radius:10px;font-family:var(--mono);font-size:.78rem;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--rail);color:#fff;padding:12px 20px;border-radius:12px;z-index:30;max-width:92%;font-weight:500;box-shadow:var(--sh2)}
.note{border-left:3px solid var(--signal);background:var(--warn-bg);padding:12px 16px;border-radius:10px;font-size:.86rem;margin-bottom:20px}
.foot{color:var(--muted);font-size:.78rem;padding:24px;text-align:center}
@media (max-width:640px){main{padding:20px 16px 40px}.card{padding:18px 16px}header.top{padding:12px 16px}h2{font-size:1.4rem}}
@media (prefers-reduced-motion:no-preference){.tile,.card{transition:box-shadow .2s,transform .2s}.tile:hover{box-shadow:var(--sh2);transform:translateY(-1px)}}

/* ---- gradient pass: softer, less boxy ---- */
:root{--r:20px;--g1:#1f2a37;--g2:#3b5878;--gs:linear-gradient(135deg,#f26b21,#ff9a4d);--gp:linear-gradient(135deg,#1c2634 0%,#33506f 100%);--gbg:radial-gradient(1100px 520px at 8% -8%,#dbe7f5 0%,transparent 60%),radial-gradient(900px 480px at 100% 0%,#fde8d8 0%,transparent 55%),linear-gradient(180deg,#f4f7fb,#eef2f7);--gcard:linear-gradient(160deg,#ffffff 0%,#f5f8fc 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gp:linear-gradient(135deg,#2a3b52,#41668f);--gbg:radial-gradient(1000px 500px at 5% -10%,#1b2a3f 0%,transparent 60%),radial-gradient(800px 460px at 100% 0%,#2e1f17 0%,transparent 55%),linear-gradient(180deg,#0e131a,#0b1017);--gcard:linear-gradient(160deg,#18212d,#141c27)}}
:root[data-theme="dark"]{--gp:linear-gradient(135deg,#2a3b52,#41668f);--gbg:radial-gradient(1000px 500px at 5% -10%,#1b2a3f 0%,transparent 60%),radial-gradient(800px 460px at 100% 0%,#2e1f17 0%,transparent 55%),linear-gradient(180deg,#0e131a,#0b1017);--gcard:linear-gradient(160deg,#18212d,#141c27)}
html,body{background:var(--gbg) fixed,var(--bg)}
header.top{background:linear-gradient(90deg,color-mix(in srgb,var(--surface) 92%,transparent),color-mix(in srgb,var(--surface) 70%,transparent));border-bottom:0;box-shadow:0 1px 0 var(--line),0 10px 30px -22px rgba(22,27,34,.35)}
.mark{background:var(--gp);border-radius:12px}
.mark:after{background:var(--gs)}
nav.rail{background:linear-gradient(180deg,#141b25 0%,#1d2b3d 100%)}
@media (min-width:900px){nav.rail{margin:12px 0 12px 12px;border-radius:22px;min-height:calc(100vh - 90px);box-shadow:0 18px 40px -22px rgba(10,16,26,.6)}
 nav.rail button[aria-current="true"]{background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.03))}
 nav.rail button[aria-current="true"]:before{background:var(--gs)}}
nav.rail button[aria-current="true"]{background:var(--gp)}
.card,.tile{border:0;background:var(--gcard);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(22,27,34,.04),0 18px 40px -24px rgba(31,52,82,.28)}
.tile{overflow:hidden}
.tile:before{left:0;top:0;width:100%;height:4px;border-radius:0;background:var(--gs);opacity:.9}
.tile:nth-child(3n+2):before{background:linear-gradient(90deg,#3b5878,#6f98c4)}
.tile:nth-child(3n):before{background:linear-gradient(90deg,#1c2634,#47688c)}
.tile .n{background:linear-gradient(135deg,var(--ink),var(--steel));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border-radius:999px}
.btn.primary{background:var(--gp);border:0;box-shadow:0 8px 18px -10px rgba(31,52,82,.7)}
.btn.primary:hover{filter:brightness(1.12);background:var(--gp);box-shadow:0 10px 22px -10px rgba(31,52,82,.8)}
.btn.sm{border-radius:999px}
input,select,textarea{border-radius:12px;background:linear-gradient(180deg,#fff,#f6f8fb);border-color:var(--line2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input,:root:not([data-theme="light"]) select,:root:not([data-theme="light"]) textarea{background:var(--surface2)}}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:var(--surface2)}
.pill.good{background:linear-gradient(135deg,#dff3e8,#eef9f3)}
.pill.warn{background:linear-gradient(135deg,#fde9cc,#fff5e3)}
.pill.bad{background:linear-gradient(135deg,#fad9d5,#fdeeec)}
.bar{background:rgba(31,52,82,.09)}
.bar i{background:var(--gs)}
.bar.good i{background:linear-gradient(90deg,#3b5878,#6f98c4)}
.col{border:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(240,244,249,.55));box-shadow:inset 0 0 0 1px var(--line);border-radius:20px}
.cand{border:0;border-radius:14px;background:var(--gcard)}
.link{border:0;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(232,239,248,.8));box-shadow:inset 0 0 0 1px var(--line)}
.steps span.on,.gwc button.on{background:var(--gp);border-color:transparent}
.toast{background:var(--gp);border-radius:999px}
.modal{border:0;border-radius:26px}
.note{border-left:0;background:linear-gradient(90deg,#fde6cf,#fff6ea);border-radius:16px}
th{border-bottom:1px solid var(--line)}
tbody tr:hover td{background:rgba(59,88,120,.05)}

/* ---- palette pass: navy-to-peach canvas, silver rail ---- */
:root{--gbg:linear-gradient(165deg,#0c2340 0%,#16385f 30%,#46698f 58%,#e9a273 88%,#f9c9a3 100%)}
html{min-height:100%}
body{min-height:100vh;background:var(--gbg) no-repeat,#16385f}
html{background:#16385f}
.head h2{color:#fff}
.head p{color:rgba(255,255,255,.78)}
.foot{color:#4a3424}
header.top{background:linear-gradient(90deg,rgba(255,255,255,.88),rgba(255,255,255,.7));box-shadow:0 10px 30px -18px rgba(5,18,36,.6)}
nav.rail{background:linear-gradient(180deg,#f1f3f6 0%,#c9cfd6 45%,#8f98a3 100%)}
nav.rail button{color:#2c3642}
@media (min-width:900px){
 nav.rail{box-shadow:0 22px 44px -22px rgba(4,14,28,.7),inset 0 1px 0 rgba(255,255,255,.8)}
 nav.rail button{color:#2c3642}
 nav.rail button:hover{background:rgba(255,255,255,.45);color:#0f1722}
 nav.rail button[aria-current="true"]{background:linear-gradient(90deg,#fff,rgba(255,255,255,.55));color:#0f1722;box-shadow:0 6px 16px -10px rgba(10,20,34,.55)}
 nav.rail button[aria-current="true"]:before{background:var(--gs)}}
@media (max-width:899px){nav.rail{background:linear-gradient(90deg,#eef1f4,#c4cad2)}nav.rail button{background:rgba(255,255,255,.55);border-color:transparent}nav.rail button[aria-current="true"]{background:var(--gp);color:#fff}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gbg:linear-gradient(165deg,#07121f 0%,#0f2842 40%,#2c3e55 70%,#6b4630 100%)}:root:not([data-theme="light"]) .foot{color:#d9c3b0}:root:not([data-theme="light"]) header.top{background:linear-gradient(90deg,rgba(22,29,39,.85),rgba(22,29,39,.65))}}
:root[data-theme="dark"]{--gbg:linear-gradient(165deg,#07121f 0%,#0f2842 40%,#2c3e55 70%,#6b4630 100%)}
:root[data-theme="dark"] .foot{color:#d9c3b0}:root[data-theme="dark"] header.top{background:linear-gradient(90deg,rgba(22,29,39,.85),rgba(22,29,39,.65))}

/* ---- splash pass: fixed colour blobs on deep navy, slow drift ---- */
html{background:#0b2036}
body{background:transparent !important;position:relative;isolation:auto}
.shell{position:relative;z-index:0}
body:before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;filter:blur(36px) saturate(1.1);
 background:
  radial-gradient(38% 34% at 88% 8%,#ff8a3d 0%,rgba(255,138,61,0) 70%),
  radial-gradient(34% 30% at 12% 92%,#19b8a6 0%,rgba(25,184,166,0) 70%),
  radial-gradient(36% 32% at 80% 88%,#8b5cf6 0%,rgba(139,92,246,0) 70%),
  radial-gradient(26% 24% at 46% 52%,#ffc857 0%,rgba(255,200,87,0) 70%),
  radial-gradient(30% 28% at 6% 34%,#2f6fe4 0%,rgba(47,111,228,0) 70%),
  radial-gradient(24% 22% at 62% 14%,#ef476f 0%,rgba(239,71,111,0) 70%),
  linear-gradient(160deg,#0b2036,#12335a)}
@media (prefers-reduced-motion:no-preference){body:before{animation:splash 38s ease-in-out infinite alternate}
 @keyframes splash{0%{transform:translate3d(0,0,0) scale(1) rotate(0)}50%{transform:translate3d(-2.5%,2%,0) scale(1.06) rotate(2deg)}100%{transform:translate3d(2%,-2.5%,0) scale(1.03) rotate(-2deg)}}}
.foot{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.55)}
:root[data-theme="dark"] .foot,:root:not([data-theme="light"]) .foot{color:#fff}
.head h2{text-shadow:0 2px 14px rgba(0,0,0,.35)}
.head p{color:rgba(255,255,255,.88);text-shadow:0 1px 8px rgba(0,0,0,.4)}

/* ---- overview: open layout, glass ribbon, flowing links ---- */
.hero{margin:6px 0 30px}
.hero-k{color:rgba(255,255,255,.7);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.hero h2{color:#fff;font-size:2.3rem;font-weight:800;margin:6px 0 8px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero p{color:rgba(255,255,255,.88);max-width:62ch;margin:0;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.ribbon{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:26px;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 24px 50px -28px rgba(0,10,30,.7);overflow:hidden}
.stat{padding:26px 26px 24px;position:relative;color:#fff}
.stat+.stat{border-left:1px solid rgba(255,255,255,.2)}
.stat i{display:block;width:26px;height:4px;border-radius:4px;margin-bottom:14px;box-shadow:0 0 16px currentColor}
.stat .n{font-family:var(--display);font-size:2.3rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.stat .l{color:rgba(255,255,255,.8);font-size:.82rem;margin-top:6px}
.glass{margin-bottom:26px;padding:6px 4px;color:#fff}

function calc(e,a,adjs,loans){
  a=a||ZERO;adjs=adjs||[];loans=loans||[];
  const m=e.salary,half=m/2,daily=m*12/DAY_FACTOR,hourly=daily/8;
  const otPay=a.ot*hourly*1.25,ndPay=a.nd*hourly*.10;
  const absDed=(a.absent+a.unpaid)*daily,lateDed=a.late/60*hourly;
  const gross=half+otPay+ndPay-absDed-lateDed;

function apprCalc(e){
  const a=db.appr[e.id],rs=db.rocks.filter(r=>r.empId===e.id),avg=rs.length?rs.reduce((s,r)=>s+r.pct,0)/rs.length:0;
  const rocks=r2(1+4*avg/100),vals=e.flags.length?Math.min(a.values,3):a.values;
  const fin=r2(rocks*.5+a.kpi*.3+vals*.2);
  const rating=fin>=4.5?'Outstanding':fin>=3.5?'Exceeds':fin>=2.5?'Meets':'Below';
  const merit=fin>=4.5?8:fin>=3.5?5:fin>=2.5?3:0;
  return {rocks,vals,fin,rating,merit,capped:e.flags.length&&a.values>3};
}

function kcalc(){
  const K=db.kpi,T={},G={},O={};
  Object.keys(TEAMS).forEach(t=>T[t]={n:0,agreed:0,logged:0,closed:0,ontime:0,ftr:0});
  Object.keys(GOALS).forEach(g=>G[g]={n:0,closed:0,ontime:0});
  SVC.forEach(s=>{const b=T[s.team],l=K.logs[s.id],g=G[s.goal],ow=K.owner[s.id];b.n++;if(!s.prop)b.agreed++;g.n++;
    let o=null;if(ow){o=O[ow]||(O[ow]={n:0,agreed:0,closed:0,ontime:0,ftr:0,teams:{}});o.n++;if(!s.prop)o.agreed++;o.teams[s.team]=1}
    if(l){b.logged++;b.closed+=l.closed;b.ontime+=l.ontime;b.ftr+=l.ftr;g.closed+=l.closed;g.ontime+=l.ontime;if(o){o.closed+=l.closed;o.ontime+=l.ontime;o.ftr+=l.ftr}}});
  Object.keys(T).forEach(t=>{const b=T[t],d=TEAMS[t].s4;b.S1=b.closed?b.ontime/b.closed:null;b.S2=b.closed?b.ftr/b.closed:null;b.S3=b.agreed/b.n;
    b.s4v=K.s4[t]==null?null:K.s4[t];b.S4=ach(b.s4v,d.target,d.dir);
    b.score=wavg([[ach(b.S1,KT.I1),K.w.S1],[ach(b.S2,KT.I2),K.w.S2],[b.S3,K.w.S3],[b.S4,K.w.S4]])});
  const sum=k=>Object.values(T).reduce((s,b)=>s+b[k],0);
  const B={B1:sum('closed')?sum('ontime')/sum('closed'):null,B2:sum('closed')?sum('ftr')/sum('closed'):null,B3:sum('agreed')/sum('n'),B4:K.b4,B5:wavg(Object.keys(T).map(t=>[T[t].score,K.tw[t]]))};
  return {T,G,O,B};
}

  const P=glChecks(),ov=Math.round(P.reduce((a,p)=>a+glPct(p),0)/P.length*100),ed=has('hr','chro');
  ui.gl=ui.gl||{};const firstOpen=(P.find(p=>glPct(p)<1)||{}).id;
  let h=head('gl');
  h+=`<div class="note"><b>Before real salaries go in:</b> this page stores data in this browser only. There is no sign-in, no shared database and no backup unless you copy one. Load names and structure now to rehearse. Hold salaries and discipline records until Phase 7, the Supabase step, is done. Back up often with the button below.</div>`;
  h+=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>Readiness</h3><b class="mono" style="font-size:1.4rem">${ov}%</b></div>${bar(ov,true)}<p class="small muted" style="margin:10px 0 0">Automatic checks read your records. Ticked items are confirmations only a person can give.</p></div>`;
  P.forEach(p=>{const pc_=glPct(p),open=ui.gl[p.id]===undefined?p.id===firstOpen:ui.gl[p.id],st=pc_===1?['Done','good']:pc_>0?['In progress','warn']:['Not started',''];
   h+=`<div class="card"><button class="btn" data-act="glopen" data-id="${p.id}" style="width:100%;text-align:left;border:0;background:transparent;padding:0;display:flex;justify-content:space-between;gap:12px;align-items:center"><span><span class="mono muted">PHASE ${p.id}</span><br><b style="font-family:var(--display);font-size:1.08rem">${esc(p.t)}</b><span class="small muted"> · ${esc(p.who)}</span></span><span>${pill(st[0]+' · '+p.checks.filter(c=>c.pass).length+'/'+p.checks.length,st[1])}</span></button>`;
   if(open)h+=`<p class="small" style="margin:12px 0 8px"><b>Bring:</b> ${esc(p.bring)}</p><div>${p.checks.map(c=>c.tick&&!c.d?`<label class="row" style="padding:7px 0;border-top:1px solid var(--line);cursor:pointer"><input type="checkbox" ${c.pass?'checked':''} ${ed?'':'disabled'} data-ch="gltick" data-id="${c.k}" style="width:18px;height:18px"><span style="flex:1">${esc(c.l)}</span></label>`:`<div class="row" style="padding:7px 0;border-top:1px solid var(--line)"><span>${c.pass?'✓':'○'}</span><span style="flex:1">${esc(c.l)}</span><span class="small muted">${esc(c.d||'')}</span></div>`).join('')}</div>${p.tab!=='gl'?`<p style="margin:10px 0 0"><button class="btn sm" data-act="tab" data-id="${p.tab}">Open ${esc(NAV[p.tab])}</button></p>`:''}`;
   h+=`</div>`});
  if(ed){
   h+=`<div class="card"><h3>Load employees (Phase 1)</h3><p class="small muted" style="margin-top:0">Paste rows from Excel or CSV. Columns, in this order: <b>name, company, department, title, grade, monthly salary, manager, hired (YYYY-MM-DD), section</b>. Structure is SBU (CMG) › BA (company: PSC, CSI, ABC, or HR Shared Services) › BU (department) › FG (section). Section is optional. Grade is G2 to G8. Manager is a name already loaded or listed higher up the paste. Bad rows are skipped and listed below, good rows load.</p>
    <textarea id="im-txt" rows="7" placeholder="name,company,department,title,grade,monthly_salary,manager,hired,section&#10;Juan Dela Cruz,PSC,Operations,Site Foreman,G4,38000,,2019-03-04,Civil Works"></textarea><p><button class="btn primary" data-act="imp">Import rows</button></p>
    ${ui.imp?`<div class="${ui.imp.errs.length?'note':'small'}"><b>${ui.imp.ok} loaded.</b>${ui.imp.errs.length?'<br>'+ui.imp.errs.map(esc).join('<br>'):''}</div>`:''}</div>`;
   h+=`<div class="card"><h3>System roles (Phase 1)</h3>${table([['Person'],['Role'],['']],Object.keys(db.roles).map(id=>`<tr><td>${esc(nm(id))}</td><td>${esc(ROLEL[db.roles[id]]+(db.roles[id]==='hrsup'&&db.rteam[id]?', '+db.rteam[id]:''))}</td><td>${id==='e1'||id==='e12'?'':`<button class="btn sm" data-act="roledel" data-id="${id}">Remove</button>`}</td></tr>`))}
    <div class="form" style="margin-top:12px"><label class="f">Person<select id="rl-emp">${opts(db.emps.filter(e=>e.active!==false).map(e=>[e.id,e.name+' · '+e.sbu]))}</select></label><label class="f">Role<select id="rl-role">${opts(Object.keys(ROLEL).filter(k=>k!=='admin').map(k=>[k,ROLEL[k]]),'employee')}</select></label><label class="f">HR team (HR Team Supervisor only)<select id="rl-team">${opts(Object.keys(TEAMS))}</select></label><button class="btn primary" data-act="roleadd">Set role</button></div>
    <p class="small muted">Roles decide what each person sees and can approve. The View-as switch at the top lists everyone who holds a role. This is a rehearsal switch, not a login.</p></div>`;
   if(role()==='admin')h+=`<div class="card"><h3>System administrators</h3><p class="small muted" style="margin-top:0">Administrators see and set up every module, assign roles, load data, back up and erase. Approvals still follow the role holders (value tiers, due process). Keep this list to two people.</p>${table([['Person'],['']],(db.admins||[]).map(id=>`<tr><td>${esc(nm(id))}</td><td>${(db.admins||[]).length>1?`<button class="btn sm" data-act="admdel" data-id="${id}">Remove</button>`:'<span class="small muted">Last administrator</span>'}</td></tr>`))}<div class="form" style="margin-top:12px"><label class="f">Add administrator<select id="ad-emp">${opts(db.emps.filter(e=>e.active!==false&&!(db.admins||[]).includes(e.id)).map(e=>[e.id,e.name+' · '+e.sbu]))}</select></label><button class="btn primary" data-act="admadd">Add</button></div></div>`;
   h+=`<div class="card"><h3>Safekeeping</h3><div class="row"><button class="btn" data-act="backup">Back up live data</button><button class="btn" data-act="demo">Switch to sample data</button>${db.live?'':'<button class="btn primary" data-act="golivedb">Back to live data</button>'}</div>
    <p class="small muted">Sample data sits in its own store. Switching never touches your live records.</p>
    ${db.live&&role()==='admin'?`<div class="form" style="margin-top:10px"><label class="f">Start over (erases live data). Type ERASE<input id="er-txt" style="width:120px"></label><button class="btn danger" data-act="erase">Erase live data</button></div>`:''}</div>`;
  }
  return h;
}

const VIEWS={gl:viewGl,pm:viewPm,scm:viewScm,bud:viewBud,kpi:viewKpi,dash:viewDash,pay:viewPay,ats:viewAts,lms:viewLms,perf:viewPerf,eng:viewEng,csr:viewCsr,tr:viewTr,ess:viewEss,lr:viewLr,audit:viewAudit};
function render(){
  const y=window.scrollY,allowed=ACCESS[role()];
  if(!allowed.includes(ui.tab))ui.tab='dash';
  $('#app').innerHTML=`<header class="top"><div class="brand"><div class="mark">P</div><div><b>CMG People & Pay OS</b><small>PSC · CSI · ABC · one employee record, nine modules</small></div></div>
   <div class="who"><label for="who" class="small">View as</label><select id="who" data-ch="persona">${opts(personas().map(p=>[p.id,p.label]),me().id)}</select><button class="btn sm" data-act="tab" data-id="gl" style="display:none"></button></div></header>
   <nav class="rail" aria-label="Modules">${allowed.map(k=>`<button data-act="tab" data-id="${k}" ${ui.tab===k?'aria-current="true"':''}>${NAV[k]}</button>`).join('')}</nav>
   <div><main>${VIEWS[ui.tab]()}</main><div class="foot">Data saves to the CMG cloud when you are signed in; otherwise it stays in this browser. CMG scope: PSC, CSI and ABC. Production path: schema.sql on Supabase with row-level security, then deploy this front end on Vercel or GitHub Pages.</div></div>
   ${ui.modal?`<div class="veil" data-act="closemodal"><div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3>${esc(ui.modal.title)}</h3><button class="btn sm" data-act="closemodal">Close</button></div>${ui.modal.html}</div></div>`:''}
   ${ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:''}`;
  window.scrollTo(0,y);
}
function modal(title,html){ui.modal={title,html};render()}
function slipHtml(s,label){
  const L=(a,b,neg)=>`<tr><td>${a}</td><td class="r mono">${neg?'-':''}${esc(peso(b))}</td></tr>`;
  return `<p class="muted small">${esc(label||CYCLES[db.cycleIdx])} · ${esc(s.name)}</p><table><tbody>${L('Basic (half month)',s.basic)}${L('Overtime (125%)',s.otPay)}${L('Night differential',s.ndPay)}${L('Absences / unpaid leave',s.absDed,1)}${L('Late / undertime',s.lateDed,1)}<tr><td><b>Gross</b></td><td class="r mono"><b>${esc(peso(s.gross))}</b></td></tr>${L('SSS',s.sss,1)}${L('PhilHealth',s.ph,1)}${L('Pag-IBIG',s.pi,1)}${L('Withholding tax',s.tax,1)}${L('Company loan',s.loan,1)}${L('Other adjustments',s.adjDed,1)}<tr><td><b>Net pay</b></td><td class="r mono"><b>${esc(peso(s.net))}</b></td></tr></tbody></table>`;
}
function copyBtn(id){return `<button class="btn sm" data-act="copy" data-id="${id}">Copy</button>`}

 glopen:d=>{ui.gl=ui.gl||{};ui.gl[d.id]=!ui.gl[d.id];render()},
 imp:()=>{if(!has('hr','chro'))return;const raw=$('#im-txt').value.trim();if(!raw){toast('Paste your employee rows first');return}
  const rows=raw.split(/\r?\n/).map(l=>l.split(l.includes('\t')?'\t':',').map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r.some(x=>x));
  if(rows.length&&/^name$/i.test(rows[0][0]))rows.shift();
  const errs=[],ok=[],COSX=COS.concat(['HR Shared Services']),LATG={G2:1,G3:2,G4:3,G5:3,G6:4,G7:6,G8:7};
  let n=Math.max(0,...db.emps.map(e=>+String(e.id).replace(/\D/g,'')||0));
  rows.forEach((r,i)=>{const [name,co,dept,title,grade,sal,mgr,hired,sec]=r,ln='Row '+(i+1)+' ('+(name||'blank')+')';
   if(!name){errs.push(ln+': name missing');return}
   const c=COSX.find(x=>x.toLowerCase()===(co||'').toLowerCase());if(!c){errs.push(ln+': company must be PSC, CSI, ABC or HR Shared Services');return}
   const g=(grade||'').toUpperCase();if(!BANDS[g]){errs.push(ln+': grade must be one of '+Object.keys(BANDS).join(', '));return}
   const sa=+String(sal||'').replace(/[^0-9.]/g,'');if(!(sa>0)){errs.push(ln+': monthly salary missing');return}
   const hd=hired||'';if(hd&&!/^\d{4}-\d{2}-\d{2}$/.test(hd)){errs.push(ln+': hired date must be YYYY-MM-DD');return}
   if(db.emps.some(e=>e.name.toLowerCase()===name.toLowerCase()&&e.sbu===c)||ok.some(e=>e.name.toLowerCase()===name.toLowerCase()&&e.sbu===c)){errs.push(ln+': already loaded');return}
   n++;ok.push({id:'e'+n,name,sbu:c,dept:dept||'General',sec:(sec||'').trim(),title:title||'Employee',grade:g,salary:sa,mgrName:mgr||'',mgr:null,lat:LATG[g]||1,hired:hd||todayS(),active:true,flags:[]})});
  ok.forEach(e=>{const m=(e.mgrName||'').toLowerCase();if(m){const f=db.emps.concat(ok).find(x=>x.id.toLowerCase()===m||x.name.toLowerCase()===m);if(f)e.mgr=f.id;else errs.push(e.name+': manager "'+e.mgrName+'" not found, left blank')}delete e.mgrName;
   db.emps.push(e);db.att[e.id]={absent:0,unpaid:0,late:0,ot:0,nd:0};db.appr[e.id]={kpi:3,values:3,status:'draft',idp:''};db.leave[e.id]={vl:10,sl:5};db.ben[e.id]={hmoDeps:0}});
  log('Go-live','Imported '+ok.length+' employees ('+errs.length+' issues)');save();ui.imp={ok:ok.length,errs};render()},
 admadd:()=>{if(role()!=='admin')return;const e=$('#ad-emp').value;if(!e)return;db.admins=db.admins||[];if(!db.admins.includes(e))db.admins.push(e);log('Go-live',nm(e)+' made System Administrator');save();render()},
 admdel:d=>{if(role()!=='admin'||(db.admins||[]).length<2)return;db.admins=db.admins.filter(x=>x!==d.id);log('Go-live','Administrator removed: '+nm(d.id));save();if(!personas().some(p=>p.id===ui.persona))ui.persona=personas()[0].id;render()},
 roleadd:()=>{if(!has('hr','chro'))return;const e=$('#rl-emp').value,r=$('#rl-role').value;if(!e||!r)return;db.roles[e]=r;if(r==='hrsup'){db.rteam=db.rteam||{};db.rteam[e]=$('#rl-team').value}log('Go-live',nm(e)+' set as '+ROLEL[r]);save();render()},

 itadd:()=>{if(!has('proc','hr','chro'))return;const sku=$('#it-sku').value.trim().toUpperCase(),nmv=$('#it-nm').value.trim(),pr=+$('#it-pr').value,mn=+$('#it-mn').value||0;

 qadd:d=>{const pr=S().prs.find(x=>x.id===d.id),i=+d.i,vid=$('#qv-'+d.id+'-'+i).value,price=+$('#qp-'+d.id+'-'+i).value,lead=+$('#ql-'+d.id+'-'+i).value||0,v=vnd(vid);

 prsend:d=>{const pr=S().prs.find(x=>x.id===d.id);if(!pr.lines.every((l,i)=>pr.award[i])){toast('Award every line first. Split awards are fine.');return}
